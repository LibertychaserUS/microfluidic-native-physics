[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "microfluidic-native-physics"
version = "0.5.0"
description = "Code and artifacts of the preprint 'When Can a Learned Design Surrogate Be Trusted in a Self-Driving Microfluidics Laboratory?'"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Zhiyuan Zhang" },
]
dependencies = []

[project.urls]
Repository = "https://github.com/LibertychaserUS/microfluidic-native-physics"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
